name: Update market quotes

# MANUAL ONLY — the live 5-minute refresh runs on Cloudflare (worker/).
#
# The schedule used to live here and was removed after measuring it: a
# "*/5 * * * *" cron produced ZERO scheduled runs in 79 minutes on this
# repo. GitHub's scheduler is best-effort and throttles short intervals
# hard, so it cannot deliver "every 5 minutes". Cloudflare cron triggers
# fire on time, so the updater moved there.
#
# This workflow stays as a manual escape hatch: it refreshes the committed
# data/*.json (the fallback the site ships with) when you want a fresh
# snapshot in the repo.
on:
  workflow_dispatch:

# Only one refresh at a time; a slow run must not stack up behind the next.
concurrency:
  group: update-quotes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No dependencies and no API key: the fetcher is stdlib-only and both
      # feeds are keyless.
      - name: Fetch quotes
        run: python -u tools/fetch_quotes.py --once

      - name: Commit if the data changed
        run: |
          git config user.name  "libera-bot"
          git config user.email "bot@users.noreply.github.com"

          # Nothing moved (markets closed, or an identical snapshot)? Then do
          # not create an empty commit — it would redeploy for no reason.
          if git diff --quiet -- data/; then
            echo "no change - skipping commit"
            exit 0
          fi

          git add data/quotes.json data/series.json
          git commit -m "data: quotes $(date -u '+%Y-%m-%d %H:%M') UTC"

          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi

          # Someone else pushed while this run was fetching. These files are
          # generated artifacts, so there is nothing to merge — rewind onto
          # the new tip and re-fetch. Never rebase them: a conflict would
          # leave "<<<<<<<" markers inside the JSON the site reads.
          echo "push rejected - rebuilding on top of the new tip"
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

          python -u tools/fetch_quotes.py --once

          if git diff --quiet -- data/; then
            echo "already up to date after rewind"
            exit 0
          fi
          git add data/quotes.json data/series.json
          git commit -m "data: quotes $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push origin "HEAD:${GITHUB_REF_NAME}"
